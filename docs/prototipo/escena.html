<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c2255c">
<title>Zaqora · Capítulo</title>
<style>
  :root {
    --fondo: #f7f4ef;
    --tinta: #1f1d1b;
    --tenue: #6b6560;
    --villano: #c2255c;
    --villano-suave: #fbe3ec;
    --casilla-clara: #ece6dc;
    --casilla-oscura: #b9ad9c;
    --acierto: #2b8a3e;
    --linea: #d9d2c7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--fondo); color: var(--tinta);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .app { max-width: 360px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  header { height: 48px; display: flex; align-items: center; justify-content: center; padding: 0 12px;
    font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .villano { height: 80px; display: flex; align-items: center; gap: 10px; padding: 0 12px; }
  .avatar { flex: 0 0 56px; height: 56px; border-radius: 50%; background: var(--villano-suave);
    border: 2px solid var(--villano); display: grid; place-items: center; font-size: 30px; color: var(--villano);
    transition: transform .2s; }
  .avatar.despierto { background: var(--villano); color: #fff; }
  .burbuja { flex: 1; background: var(--villano-suave); border: 1px solid var(--villano); border-radius: 12px;
    padding: 8px 10px; font-size: 15px; line-height: 1.3; color: #6d1236; min-height: 44px; }
  .tablero-marco { position: relative; width: 352px; height: 352px; margin: 0 auto; }
  .tablero { display: grid; grid-template-columns: repeat(8, 44px); grid-template-rows: repeat(8, 44px);
    border: 1px solid var(--linea); }
  .casilla { width: 44px; height: 44px; display: grid; place-items: center; font-size: 34px; line-height: 1;
    font-family: "Segoe UI Symbol", "Noto Sans Symbols 2", "DejaVu Sans", serif; font-variant-emoji: text;
    border: 0; padding: 0; cursor: pointer; position: relative; }
  .clara { background: var(--casilla-clara); }
  .oscura { background: var(--casilla-oscura); }
  .pieza-b { color: #fff; text-shadow: 0 0 2px #000, 0 0 1px #000; }
  .pieza-n { color: #1f1d1b; }
  .seleccion { outline: 3px solid var(--tinta); outline-offset: -3px; }
  .pista { outline: 3px dashed var(--tinta); outline-offset: -4px; }
  .acierto-casilla::after { content: "✓"; position: absolute; right: 2px; bottom: 0; font-size: 14px;
    color: #fff; background: var(--acierto); border-radius: 50%; width: 16px; height: 16px; display: grid; place-items: center; }
  .sello { position: absolute; inset: 0; background: rgba(247, 244, 239, .92); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; }
  .sello .candado { font-size: 32px; }
  .sello .rotulo { font-size: 12px; letter-spacing: .12em; color: var(--tenue); }
  .progreso { height: 24px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--tenue); }
  footer { height: 64px; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); display: flex; align-items: center; }
  button.accion { width: 100%; min-height: 48px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .primario { background: var(--tinta); color: #fff; border: 0; }
  .secundario { background: transparent; color: var(--tinta); border: 1px solid var(--tinta); }
  .contorno { background: transparent; color: var(--tinta); border: 1px solid var(--linea); }
  .contorno:disabled { color: #b5aea6; cursor: default; }
  .sello button.accion { width: 220px; }
  .explica { margin: 0; font-size: 14px; line-height: 1.35; color: var(--tinta); max-width: 260px; }
  .historia { display: flex; flex-direction: column; gap: 14px; align-items: center; max-width: 290px; }
  .historia p { margin: 0; font-size: 16px; line-height: 1.45; color: var(--tinta); font-style: italic; }
  .historia-pie { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; color: var(--tenue); }
  .oculto { display: none !important; }
  /* Piezas con imagen (bandos de assets/) */
  .casilla img { width: 40px; height: 40px; display: block; pointer-events: none;
    filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .35)); }
  .avatar img { width: 46px; height: 46px; display: block; }
  header { position: relative; }
  .btn-bando { position: absolute; right: 2px; top: 2px; width: 44px; height: 44px; border: 0; background: transparent;
    border-radius: 10px; cursor: pointer; padding: 4px; }
  .btn-bando img { width: 36px; height: 36px; display: block; }
  .btn-bando:focus-visible, .bando:focus-visible { outline: 3px solid var(--villano); outline-offset: 1px; }
  .elegir { position: absolute; inset: 0; background: var(--fondo); display: flex; flex-direction: column;
    padding: 14px 12px; gap: 10px; overflow-y: auto; }
  .elegir h2 { margin: 0; font-size: 16px; text-align: center; }
  .elegir p { margin: 0; font-size: 13px; color: var(--tenue); text-align: center; }
  .bandos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .bando { background: #fff; border: 1px solid var(--linea); border-radius: 12px; padding: 8px 6px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; color: var(--tinta); }
  .bando .fila { display: flex; justify-content: center; }
  .bando .fila img { width: 34px; height: 34px; }
  .bando[aria-pressed="true"] { border: 2px solid var(--tinta); }
  @media (prefers-reduced-motion: reduce) { .avatar { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <header><span id="titulo">Capítulo · Zaqora</span>
    <button class="btn-bando oculto" id="btn-bando" aria-label="Cambiar de bando"></button></header>
  <div class="villano">
    <div class="avatar" id="avatar" aria-hidden="true">♞</div>
    <div class="burbuja" id="burbuja" role="status" aria-live="polite"></div>
  </div>
  <div class="tablero-marco">
    <div class="tablero" id="tablero" role="grid" aria-label="Tablero"></div>
    <div class="sello" id="sello">
      <div class="candado" aria-hidden="true">🔒</div>
      <div class="rotulo">ENCUENTRO SELLADO</div>
      <p class="explica" id="explica">Aquí está tu última derrota, justo antes de la jugada donde se te fue. ¿La quieres ver?</p>
      <div class="historia oculto" id="historia">
        <p id="historia-texto" aria-live="polite"></p>
        <div class="historia-pie"><span id="historia-paso"></span>
          <button class="accion primario" id="btn-sigue">Continuar</button></div>
      </div>
      <button class="accion primario" id="btn-muestrame">Muéstrame</button>
      <button class="accion secundario" id="btn-dejame">Déjame en paz</button>
    </div>
    <div class="elegir oculto" id="elegir" role="dialog" aria-labelledby="elegir-titulo">
      <h2 id="elegir-titulo">Elige tu bando</h2>
      <p>Tus piezas serán de este bando. El villano llega con otro.</p>
      <div class="bandos" id="bandos"></div>
    </div>
  </div>
  <div class="progreso" id="progreso">Encuentro 1 de 1</div>
  <footer>
    <button class="accion contorno" id="btn-pista" disabled>Pista del villano</button>
  </footer>
</div>

<script src="config.js"></script>
<script>
/* El registro de eventos usa la configuración de config.js (ver LEEME.md).
   Si está vacía, la escena funciona igual pero no registra nada. */
const CFG = window.ZAQORA || {};
const SUPABASE_URL = CFG.SUPABASE_URL || "";
const SUPABASE_KEY = CFG.SUPABASE_KEY || "";   // clave pública (anon), nunca la service_role

const q = new URLSearchParams(location.search);
const P = q.get("p") || "demo";                    // participante (P1…P5), nunca su usuario
const V = q.get("v") || "-";                       // variante del mensaje (A, B o C)
const FEN = q.get("fen") || "r1bqkbnr/pppp1ppp/2n5/4p3/2B1P3/5Q2/PPPP1PPP/RNB1K1NR w KQkq - 2 3";
const SOL = (q.get("sol") || "f3f7").slice(0, 4);  // jugada esperada en UCI
const COLOR = q.get("color") === "b" ? "b" : "w";  // color con el que jugó el participante
const VILLANO = q.get("villano") || "La Horquilla Hambrienta";
const JUGADA = q.get("jugada") || "";

const T = {
  sellado: "Esa partida dolió. Yo estaba ahí.",
  despierto: JUGADA ? `Jugada ${JUGADA}. Aquí fue. ¿Ves lo que yo vi?` : "Aquí fue. ¿Ves lo que yo vi?",
  fallo: "Casi. Yo también lo habría intentado. Otra vez.",
  pista: "Te ayudo un poco: empieza por la pieza marcada.",
  resuelto: "…Esta vez no. Nos volveremos a ver.",
  pausa: "Está bien. Aquí te espero cuando quieras."
};

const GLIFO = { k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟" };
const NOMBRE = { k: "rey", q: "dama", r: "torre", b: "alfil", n: "caballo", p: "peón" };
/* Bandos: los genera preparar_piezas.py a partir de las carpetas de assets/.
   El jugador elige el suyo; el rival sale de los demás bandos y cambia con cada derrota.
   Si piezas/bandos.json no carga, la escena usa los glifos de siempre. */
let BANDOS = [];           // [{ id, nombre }]
let JUGADOR = null, RIVAL = null;
function leerGuardado(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function guardarLocal(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function semilla(txt) {    // hash FNV-1a: la misma derrota siempre trae el mismo rival
  let h = 2166136261;
  for (const ch of txt) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function existe(id) { return !!id && BANDOS.some((b) => b.id === id); }
function nombreBando(id) { const b = BANDOS.find((x) => x.id === id); return b ? b.nombre : ""; }
function elegirRival() {
  if (existe(q.get("rival"))) return q.get("rival");
  const otros = BANDOS.filter((b) => b.id !== JUGADOR);
  const lista = otros.length ? otros : BANDOS;
  return lista[semilla(`${FEN}|${SOL}|${P}`) % lista.length].id;
}
function srcPieza(bando, tipo, blanca) { return `piezas/${bando}/${tipo}-${blanca ? "clara" : "oscura"}.png`; }
function imagen(src) { const i = document.createElement("img"); i.src = src; i.alt = ""; return i; }

let tablero = {};          // "e4" -> "P" / "p"
let origen = null, intentos = 0, estado = "sellado";

function registrar(evento, extra) {
  if (!SUPABASE_URL || !SUPABASE_KEY) return;
  fetch(`${SUPABASE_URL}/rest/v1/eventos`, {
    method: "POST",
    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}`,
               "Content-Type": "application/json", "Prefer": "return=minimal" },
    body: JSON.stringify({ participante: P, variante: V, evento, detalle: extra || null }),
    keepalive: true
  }).catch(() => {});
}

function leerFen(fen) {
  const filas = fen.split(" ")[0].split("/");
  const t = {};
  filas.forEach((fila, i) => {
    let col = 0;
    for (const ch of fila) {
      if (/\d/.test(ch)) { col += +ch; continue; }
      t["abcdefgh"[col] + (8 - i)] = ch;
      col++;
    }
  });
  return t;
}

function dibujar(marcas = {}) {
  const el = document.getElementById("tablero");
  el.innerHTML = "";
  const filas = COLOR === "w" ? [8,7,6,5,4,3,2,1] : [1,2,3,4,5,6,7,8];
  const cols = COLOR === "w" ? "abcdefgh" : "hgfedcba";
  for (const r of filas) {
    for (const c of cols) {
      const sq = c + r;
      const b = document.createElement("button");
      const oscura = ("abcdefgh".indexOf(c) + r) % 2 === 1;
      b.className = "casilla " + (oscura ? "oscura" : "clara");
      const pz = tablero[sq];
      let etiqueta = sq;
      if (pz) {
        const blanca = pz === pz.toUpperCase();
        const tipo = pz.toLowerCase();
        const propia = (blanca ? "w" : "b") === COLOR;
        const bando = propia ? JUGADOR : RIVAL;
        if (bando) b.appendChild(imagen(srcPieza(bando, tipo, blanca)));
        else { b.textContent = GLIFO[tipo]; b.classList.add(blanca ? "pieza-b" : "pieza-n"); }
        etiqueta += `, ${NOMBRE[tipo]} ${blanca ? "blanco" : "negro"}` + (bando ? ` (${propia ? "tuyo" : nombreBando(bando)})` : "");
      }
      b.setAttribute("aria-label", etiqueta);
      if (marcas[sq]) b.classList.add(marcas[sq]);
      b.onclick = () => tocar(sq);
      el.appendChild(b);
    }
  }
}

function decir(texto) { document.getElementById("burbuja").textContent = texto; }

function tocar(sq) {
  if (estado !== "despierto") return;
  if (!origen) {
    if (!tablero[sq]) return;
    origen = sq;
    dibujar({ [sq]: "seleccion" });
    return;
  }
  if (sq === origen) { origen = null; dibujar(); return; }
  const jugada = origen + sq;
  intentos++;
  if (jugada === SOL) {
    tablero[sq] = tablero[origen];
    delete tablero[origen];
    estado = "resuelto";
    dibujar({ [sq]: "acierto-casilla" });
    decir(T.resuelto);
    document.getElementById("avatar").classList.remove("despierto");
    document.getElementById("progreso").textContent = "Encuentro superado";
    document.getElementById("btn-pista").disabled = true;
    registrar("resuelto", { intentos });
  } else {
    origen = null;
    dibujar();
    decir(T.fallo);
    registrar("intento_fallido", { jugada, intentos });
  }
}

document.getElementById("btn-muestrame").onclick = () => {
  estado = "despierto";
  document.getElementById("sello").classList.add("oculto");
  document.getElementById("avatar").classList.add("despierto");
  document.getElementById("btn-pista").disabled = false;
  document.getElementById("progreso").textContent = `Juegas con ${COLOR === "w" ? "blancas" : "negras"}: toca una pieza y luego su casilla`;
  decir(T.despierto);
  dibujar();
  registrar("muestrame");
};
document.getElementById("btn-dejame").onclick = () => {
  estado = "pausa";
  decir(T.pausa);
  document.getElementById("btn-muestrame").textContent = "Ya estoy listo";
  document.getElementById("btn-dejame").classList.add("oculto");
  registrar("dejame_en_paz");
};
document.getElementById("btn-pista").onclick = () => {
  if (estado !== "despierto") return;
  origen = null;
  dibujar({ [SOL.slice(0, 2)]: "pista" });
  decir(T.pista);
  registrar("pista");
};

function pintarBandos() {
  const av = document.getElementById("avatar");
  const btnBando = document.getElementById("btn-bando");
  if (!JUGADOR || !RIVAL) { av.textContent = "♞"; btnBando.classList.add("oculto"); return; }
  av.replaceChildren(imagen(srcPieza(RIVAL, "k", COLOR === "b")));   // el rey del bando rival es el villano
  btnBando.replaceChildren(imagen(srcPieza(JUGADOR, "k", COLOR === "w")));
  btnBando.classList.toggle("oculto", BANDOS.length < 2);
  document.querySelector(".sello .rotulo").textContent = `ENCUENTRO SELLADO · ${nombreBando(RIVAL).toUpperCase()}`;
}

function mostrarElegir() {
  const cont = document.getElementById("bandos");
  cont.replaceChildren();
  for (const bd of BANDOS) {
    const card = document.createElement("button");
    card.className = "bando";
    card.setAttribute("aria-pressed", String(bd.id === JUGADOR));
    const fila = document.createElement("div");
    fila.className = "fila";
    for (const t of ["n", "k", "q"]) fila.appendChild(imagen(srcPieza(bd.id, t, true)));
    card.append(fila, document.createTextNode(bd.nombre));
    card.onclick = () => {
      JUGADOR = bd.id;
      guardarLocal("zaqora_bando", JUGADOR);
      RIVAL = elegirRival();
      document.getElementById("elegir").classList.add("oculto");
      pintarBandos();
      dibujar();
      registrar("bando", { jugador: JUGADOR, rival: RIVAL });
    };
    cont.appendChild(card);
  }
  document.getElementById("elegir").classList.remove("oculto");
  (cont.querySelector('[aria-pressed="true"]') || cont.firstChild).focus();
}
document.getElementById("btn-bando").onclick = mostrarElegir;

/* Historia del villano: párrafos que arma el detector (IA o plantilla) y viajan en el enlace (?h=, base64url). */
function leerHistoria() {
  const h = q.get("h");
  if (!h) return [];
  try {
    const b64 = h.replace(/-/g, "+").replace(/_/g, "/") + "=".repeat((4 - (h.length % 4)) % 4);
    const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
    const lista = JSON.parse(new TextDecoder().decode(bytes));
    return Array.isArray(lista) ? lista.filter((x) => typeof x === "string" && x.trim()).slice(0, 5) : [];
  } catch (e) { return []; }
}
const HISTORIA = leerHistoria();
let parrafo = 0;
function mostrarParrafo() {
  document.getElementById("historia-texto").textContent = HISTORIA[parrafo];
  document.getElementById("historia-paso").textContent = `${parrafo + 1} de ${HISTORIA.length}`;
  const ultimo = parrafo === HISTORIA.length - 1;
  document.getElementById("btn-sigue").classList.toggle("oculto", ultimo);
  document.getElementById("btn-muestrame").classList.toggle("oculto", !ultimo);
  document.getElementById("btn-dejame").classList.toggle("oculto", !ultimo);
  if (ultimo) registrar("historia_leida", { fuente: q.get("hf") || "", parrafos: HISTORIA.length });
}
if (HISTORIA.length) {
  document.getElementById("explica").classList.add("oculto");
  document.querySelector(".sello .candado").classList.add("oculto");
  document.getElementById("historia").classList.remove("oculto");
  document.getElementById("btn-sigue").onclick = () => { parrafo++; mostrarParrafo(); };
  mostrarParrafo();
}

async function iniciar() {
  document.getElementById("titulo").textContent = `Capítulo · ${VILLANO}`;
  tablero = leerFen(FEN);
  decir(T.sellado);
  try {
    const r = await fetch("piezas/bandos.json", { cache: "no-cache" });
    BANDOS = (await r.json()).bandos || [];
  } catch (e) { BANDOS = []; }
  if (BANDOS.length) {
    JUGADOR = [q.get("bando"), leerGuardado("zaqora_bando")].find(existe) || null;
    if (JUGADOR) RIVAL = elegirRival();
    pintarBandos();
    if (!JUGADOR && q.get("vista") !== "despierto") mostrarElegir();
  }
  dibujar();
  if (q.get("vista") === "despierto") document.getElementById("btn-muestrame").click();  // solo para capturas
}
iniciar();
try {
  if (!sessionStorage.getItem("abrio")) { registrar("abrio"); sessionStorage.setItem("abrio", "1"); }
} catch (e) { registrar("abrio"); }
</script>
</body>
</html>
