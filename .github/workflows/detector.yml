# Detector de derrotas de Zaqora en la nube.
# Cada 10 minutos revisa las partidas de los jugadores registrados (al entrar con Lichess),
# manda el primer contacto (un capítulo por cada una de sus últimas 5 derrotas) y un capítulo
# por cada derrota nueva. Las claves vienen de los secretos del repositorio; nunca se imprimen.
name: Detector de derrotas
run-name: ${{ inputs.alias && format('Revisar ahora · {0}', inputs.alias) || 'Detector de derrotas' }}

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      alias:
        description: "Código del jugador (J1, J2…) para revisar solo a ese jugador. Vacío = todos."
        required: false
        default: ""

concurrency:
  group: detector-zaqora
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detectar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar Stockfish y librerías
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq stockfish
          python -m pip install --quiet chess pywebpush

      - name: Preparar la clave privada VAPID
        env:
          VAPID: ${{ secrets.ZAQORA_VAPID_PRIVADA }}
        run: |
          printf '%s\n' "$VAPID" > "$RUNNER_TEMP/vapid.pem"
          chmod 600 "$RUNNER_TEMP/vapid.pem"
          # Revisión del formato, sin mostrar la clave
          python -m pip install --quiet py-vapid
          python - "$RUNNER_TEMP/vapid.pem" <<'PY'
          import sys
          from py_vapid import Vapid
          try:
              Vapid.from_file(sys.argv[1])
              print("Clave VAPID: formato correcto.")
          except Exception as e:
              print("::error::El secreto ZAQORA_VAPID_PRIVADA no tiene un formato válido. Pégalo en una sola línea (ver LEEME).")
              sys.exit(1)
          PY

      - name: Revisar derrotas y enviar avisos
        env:
          ZAQORA_SUPABASE_URL: ${{ secrets.ZAQORA_SUPABASE_URL }}
          ZAQORA_SUPABASE_SERVICE_KEY: ${{ secrets.ZAQORA_SUPABASE_SERVICE_KEY }}
          ZAQORA_VAPID_CONTACTO: ${{ secrets.ZAQORA_VAPID_CONTACTO }}
          ZAQORA_VAPID_PRIVADA_ARCHIVO: ${{ runner.temp }}/vapid.pem
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          ZAQORA_STOCKFISH: /usr/games/stockfish
          SOLO: ${{ inputs.alias }}
        run: |
          # «Revisar ahora» manda el código del jugador; solo se acepta J1, J2… o P0…P9.
          if [[ "$SOLO" =~ ^[JP][0-9]{1,5}$ ]]; then
            python zaqora/detector/detectar_derrotas.py --enviar --solo "$SOLO"
          else
            python zaqora/detector/detectar_derrotas.py --enviar
          fi
